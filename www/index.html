<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Lauren's Class Planner</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260524-llmark">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-main">
        <div class="brand-lockup" id="brandLockup">
          <div class="brand-mark" id="brandMark" aria-hidden="true">LL</div>
          <div class="routine-meta">
            <div class="brand-owner" id="brandOwner">Lauren Landman</div>
            <div class="routine-name" id="routineName"></div>
            <button class="discipline-badge" id="disciplineBadge" data-action="switch-discipline"></button>
          </div>
        </div>
        <button class="btn primary header-plan" id="editToggle" data-action="toggle-edit" title="Edit this class plan">Edit Plan</button>
      </div>
      <div class="header-actions" id="headerActions" aria-label="Class tools">
        <button class="btn" data-action="load-routines" title="Open saved classes">Saved</button>
        <button class="btn" data-action="load-schedule" title="Open upcoming classes">Classes</button>
      </div>
    </div>
    <div id="editBar" class="edit-bar hidden"></div>
    <div id="teacherVisuals" class="teacher-visuals"></div>
    <div id="classSummary" class="class-summary"></div>
    <div id="progressSection" class="progress-section"></div>
    <div id="eqFilter" class="eq-filter"></div>
    <div id="blocks" class="blocks"></div>
  </div>
  <div id="modalContainer"></div>
  <div id="libraryOverlay" class="library-overlay hidden" data-action="close-library"></div>
  <div id="libraryPanel" class="library-panel hidden">
    <div class="library-header">
      <div class="library-title" id="libraryTitle">Saved Classes</div>
      <button class="btn" data-action="close-library">Close</button>
    </div>
    <div class="library-content" id="libraryContent"></div>
  </div>

  <!-- Bottom Sheet -->
  <div class="sheet-overlay" id="sheetOverlay"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div id="sheetContent"></div>
  </div>

<script type="module" src="js/app.js?v=20260524-llmark"></script>
</body>
</html>
